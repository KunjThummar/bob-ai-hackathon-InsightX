submission:
  title: "Mission Readiness AI"

  problem_statement: >
    Mission-critical equipment generates large volumes of telemetry, but
    traditional maintenance approaches often rely on fixed schedules,
    operating cycles, periodic inspections, or reactive fault events.
    Maintenance teams and fleet decision-makers need earlier, explainable
    information about abnormal equipment behavior, remaining useful life,
    and which assets should receive maintenance attention first.

  solution_summary: >
    Mission Readiness AI is a predictive-maintenance decision-support system
    that converts equipment telemetry into an interpretable assessment of
    asset condition. It combines temporal feature engineering, Random Forest
    RUL prediction, Isolation Forest anomaly detection, mission readiness
    scoring, maintenance prioritization, and an AI Copilot that explains the
    computed results to human users.

  key_features:
    - "Remaining Useful Life prediction using Random Forest"
    - "Multivariate anomaly detection using Isolation Forest"
    - "Temporal feature engineering using rolling statistics and sensor trends"
    - "Mission Readiness scoring and maintenance prioritization"
    - "AI Copilot for human-readable explanations of ML results"

  tech_stack:
    languages:
      - "Python"

    frameworks:
      - "Scikit-learn"

    ibm_technologies: []

    databases: []

    other:
      - "NASA C-MAPSS FD001 dataset"
      - "Random Forest"
      - "Isolation Forest"
      - "RobustScaler"
      - "Time-series feature engineering"

  what_we_are_most_proud_of: >
    We are most proud of connecting multiple predictive-maintenance layers
    into a single decision-support workflow: telemetry is transformed into
    temporal features, RUL is predicted, abnormal behavior is detected,
    readiness and maintenance priority are calculated, and the results are
    finally explained through an AI Copilot. The system keeps quantitative
    ML predictions separate from natural-language explanation, making the
    workflow more transparent and easier to validate.

  known_limitations: >
    The prototype uses NASA C-MAPSS FD001 simulated turbofan-engine data
    rather than classified or proprietary military fleet data. The readiness
    and maintenance-priority thresholds and weights are prototype assumptions
    and would require domain calibration for real operational deployment.
    The system provides maintenance decision support and does not guarantee
    failure prediction, diagnose specific component failures, or autonomously
    authorize or reject missions.

